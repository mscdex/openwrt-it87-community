name: Build and Release it87-community OpenWrt APK Package

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build for ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      arch: ${{ matrix.arch }}
      branch: ${{ matrix.branch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            branch: 25.12.4

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Package via OpenWrt SDK
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          PACKAGES: it87-community
          V: s

      - name: Rename and Prep APK Artifacts
        run: |
          mkdir -p staging_dir
          find bin/ -type f -name "*kmod-hwmon-it87-community-*.apk" | while read -r file; do
            filename=$(basename "$file")
            cp "$file" "staging_dir/${{ matrix.arch }}-${{ matrix.branch }}-$filename"
          done

      - name: Temporarily Store Built Packages
        uses: actions/cache/save@v5
        with:
          path: staging_dir/*
          key: openwrt-apk-${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}-${{ matrix.branch }}

  publish:
    name: Deploy to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Install Cache Module
        run: npm install @actions/cache

      - name: Retrieve Built Packages
        uses: actions/github-script@v9
        env:
          CACHE_PREFIX: "openwrt-apk-${{ github.sha }}-${{ github.run_id }}-"
          TARGET_DIR: "release_assets"
        with:
          script: |
            const cache = require('@actions/cache');
            const fs = require('fs');
            const path = require('path');
            
            const prefix = process.env.CACHE_PREFIX;
            const targetMainDir = process.env.TARGET_DIR;
            
            try {
              const cacheListResponse = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                key: prefix,
              });
              
              const cachesFound = cacheListResponse?.data?.actions_caches || [];
              
              if (!Array.isArray(cachesFound) || cachesFound.length === 0) {
                core.setFailed('No matching caches found');
                return;
              }
              
              core.info(`Found ${cachesFound.length} cache(s) matching prefix "${prefix}"`);
              
              fs.mkdirSync(targetMainDir, { recursive: true });
              
              for (const item of cachesFound) {
                core.info(`Processing cache key: ${item.key}`);
                
                const matchedKey = await cache.restoreCache([targetMainDir], item.key);
                
                if (matchedKey)
                  core.info(`Successfully retrieved cache for: ${item.key}`);
                else
                  core.warning(`Failed to retrieve cache for: ${item.key}`);
              }
            } catch (ex) {
              core.setFailed(`Exception while retrieving caches: ${ex.stack}`);
            }

      - name: Extract Version and Set Release Metadata
        id: meta
        run: |
          if [ -n "$(find release_assets -maxdepth 0 -empty)" ]; then
            echo "No packages to release"
            exit 1
          fi
          
          RAW_SRC_VERSION=$(grep -m 1 '^PKG_SOURCE_VERSION:=' it87-community/Makefile | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASE=$(grep -m 1 '^PKG_RELEASE:=' it87-community/Makefile | cut -d'=' -f2 | tr -d '[:space:]')
          
          if [ -z "$RAW_SRC_VERSION" ]; then
            echo "::error::Could not extract PKG_SOURCE_VERSION from Makefile!"
            exit 1
          fi
          
          if [ ${#RAW_SRC_VERSION} -eq 40 ]; then
            VERSION=$(echo "$RAW_SRC_VERSION" | cut -c1-12)
          else
            VERSION="$RAW_SRC_VERSION"
          fi
          
          TARGET_ARCH="${{ needs.build.outputs.arch }}"
          TARGET_BRANCH="${{ needs.build.outputs.branch }}"
          
          TAG_NAME="${VERSION}-${RELEASE}-${TARGET_ARCH}-${TARGET_BRANCH}"
          RELEASE_TITLE="it87-community driver ${VERSION}-${RELEASE} (${TARGET_ARCH} for ${TARGET_BRANCH})"
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying release availability for $TAG_NAME..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists! Terminating build to protect current release assets."
            exit 1
          fi

          echo "Publishing fresh production artifacts..."
          gh release create "$TAG_NAME" release_assets/* \
            --title "$RELEASE_TITLE" \
            --notes "" \
            --target "$GITHUB_SHA"
